# LOCAL / DEV BUILD COMPOSE. Builds images from this checkout (docker/*.Dockerfile)
# for local smoke tests. Production does NOT use this file. The deploy truth for
# the Mac mini is deploy/compose.prod.yml (GHCR images + Watchtower).
#
# Phase 1 Stage A — single compose file for both this Mac (dev workspace)
# and the remote Mac mini (when Stage B lands). Postgres lives outside
# compose. IB Gateway also lives outside compose (Java GUI, not
# containerizable), either on the Docker host or on another reachable machine.
# Containers reach host-native services via host.docker.internal; if IB runs
# elsewhere, set IB_GATEWAY_HOST to that machine's LAN/Tailscale address or to
# host.docker.internal only after tunneling the Gateway port onto the Docker
# host.
#
# Profiles
#   default ............ api + web + realtime (long-running)
#   migrate ............ migrator (one-shot — `docker compose run --rm migrator`)
#
# Local smoke test
#   docker compose build
#   docker compose run --rm migrator
#   docker compose up -d
#   curl http://localhost:8321/health
#   curl -I http://localhost:3000

services:
  migrator:
    build:
      context: .
      dockerfile: docker/migrator.Dockerfile
    image: xenon-migrator:dev
    profiles: ["migrate"]
    env_file:
      - ./.env
    volumes:
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: xenon-api:dev
    # Order matters: ./web/.env loads AFTER ./.env so its values take
    # precedence on conflict. We rely on this precedence — swapping the
    # order would silently invert behavior for any future overlapping key.
    # `required: false` is defensive: it lets the api service parse
    # cleanly when web/.env is absent. (Note: the web service below still
    # requires web/.env, so `docker compose up` of the full stack still
    # needs the file.)
    # Why both: UW_TOKEN and ANTHROPIC_API_KEY live in web/.env per the
    # Credentials table in CLAUDE.md, but src/xenon/api/server.py and
    # src/xenon/clients/menthorq_client.py read them from os.environ. The
    # in-process load_dotenv at server.py:81-82 silently no-ops in the
    # container because the api Dockerfile doesn't ship web/.env, so
    # Compose injection is the only viable channel. Forwarding the whole
    # file also exposes EXA/CEREBRAS keys to the api container
    # (currently unused there) — accepted as a least-privilege tradeoff
    # vs. brittle per-key shell interpolation. See
    # docs/plans/2026-05-04-docker-uw-token-plumbing.md.
    env_file:
      - ./.env
      - path: ./web/.env
        required: false
    environment:
      # Futu OpenD is always a host-native daemon (Mac-only, no container
      # form), and it binds 127.0.0.1 by default. From inside a container,
      # `host.docker.internal` is the only hostname that actually reaches
      # it — a 127.0.0.1 default would dial the container's own loopback.
      FUTU_OPEND_HOST: host.docker.internal
      # /status on the realtime relay is token-only — reach it over the
      # compose network, not loopback. Token comes from ./.env via env_file.
      IB_REALTIME_STATUS_URL: http://realtime:8765/status
    # IB_GATEWAY_HOST comes from .env. Use host.docker.internal only when the
    # Gateway runs on the Docker host, or when an SSH tunnel on the Docker host
    # forwards to a localhost-only Gateway on another machine. If the Gateway
    # runs directly on another LAN/Tailscale host, set that reachable address.
    # Bind the published port to host loopback only — tailnet exposure goes
    # through `tailscale serve`, never a wildcard bind.
    ports:
      - "127.0.0.1:8321:8321"
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8321/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Optional: pin the WS URL into the bundle. When unset, the client
        # falls back via /api/ib/ws-config or window.location.hostname:8765
        # — workable for `localhost` access; set explicitly for any other
        # browser-facing hostname (LAN IP, custom domain).
        NEXT_PUBLIC_IB_REALTIME_WS_URL: ${NEXT_PUBLIC_IB_REALTIME_WS_URL:-}
    image: xenon-web:dev
    env_file:
      - ./web/.env
    environment:
      # Server-side fetches inside the Next.js container target the api
      # service over the compose network, not localhost. Var name matches
      # web/lib/xenonApi.ts and the per-route fallbacks in web/app/api/.
      XENON_API_URL: http://api:8321
      # Server-to-server trust secret, sourced once from the root .env (compose
      # interpolates ${VAR} from the compose-dir .env). The api service gets the
      # same value via its env_file: ./.env. Single source of truth — never
      # NEXT_PUBLIC_ (server-only).
      XENON_INTERNAL_API_TOKEN: ${XENON_INTERNAL_API_TOKEN:-}
      # Browser-origin guard (middleware.ts): Host allowlist for ALL /api
      # requests. Default is localhost-only — set to the tailnet host values
      # (e.g. xenon.tailnet-xxx.ts.net, with :port when non-standard) so the
      # deploy is reachable through `tailscale serve`.
      XENON_ALLOWED_HOSTS: ${XENON_ALLOWED_HOSTS:-}
    # Bind the published port to host loopback only (see api comment).
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # node:22-alpine ships busybox wget; --spider issues a HEAD-equivalent.
      # Next standalone binds IPv4 0.0.0.0:3000 only; alpine `localhost`
      # resolves to ::1 first, which fails. Use 127.0.0.1 explicitly.
      # Probe `/` — it is a plain page (middleware only guards /api/**) and
      # returns 200 regardless of auth state.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  realtime:
    build:
      context: .
      dockerfile: docker/realtime.Dockerfile
    image: xenon-realtime:dev
    env_file:
      - ./.env
    # IB_GATEWAY_HOST comes from .env (see api comment). The relay also
    # consults XENON_TRADING_MODE to derive the gateway port.
    # XENON_INTERNAL_API_TOKEN (relay → /ws-ticket/validate), XENON_QUERY_API_KEY
    # (service WS consumers) and IB_REALTIME_STATUS_TOKEN all arrive via env_file.
    environment:
      # Inside the container the relay must listen on all interfaces so the
      # host-published 127.0.0.1:8765 mapping reaches it. On bare metal the
      # relay default is loopback-only.
      WS_HOST: 0.0.0.0
      # Ticket validation targets the api service over the compose network —
      # the module default (127.0.0.1:8321) would dial the relay's own loopback.
      TICKET_VALIDATE_URL: http://api:8321/ws-ticket/validate
      # Origin allowlist for browser WS upgrades; default is localhost-only.
      # Set to the tailnet origins for prod (e.g. https://xenon.tailnet-xxx.ts.net).
      XENON_WS_ALLOWED_ORIGINS: ${XENON_WS_ALLOWED_ORIGINS:-}
    # Bind the published port to host loopback only (see api comment).
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
