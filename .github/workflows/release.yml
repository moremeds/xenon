name: Release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    # Postgres is required: scripts/tests/conftest.py and src/xenon/api/tests/conftest.py
    # have autouse fixtures that truncate xenon.* tables before every test.
    # Mirrors ci.yml::python-tests so release verify matches what master CI proved green.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xenon_app
          POSTGRES_PASSWORD: xenon_dev
          POSTGRES_DB: xenon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xenon_app -d xenon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql+asyncpg://xenon_app:xenon_dev@localhost:5432/xenon_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.13
      - run: uv sync --frozen --extra test
      - name: Pre-create xenon/events schemas
        # Alembic creates xenon.alembic_version before running upgrade(), so the
        # schema must exist beforehand. Mirrors ci.yml::python-tests.
        env:
          PGPASSWORD: xenon_dev
        run: >-
          psql -h localhost -U xenon_app -d xenon_test
          -c "CREATE SCHEMA IF NOT EXISTS xenon; CREATE SCHEMA IF NOT EXISTS events;"
      - name: Apply alembic migrations to test DB
        env:
          DATABASE_URL: postgresql+asyncpg://xenon_app:xenon_dev@localhost:5432/xenon_test
        run: uv run alembic upgrade head
      - name: Pre-create per-worker DBs (Phase 3 pytest-xdist)
        env:
          PGPASSWORD: xenon_dev
        run: |
          for i in 0 1 2 3; do
            psql -h localhost -U xenon_app -d postgres \
              -c "DROP DATABASE IF EXISTS xenon_test_gw$i WITH (FORCE);" \
              -c "CREATE DATABASE xenon_test_gw$i WITH TEMPLATE xenon_test;"
          done
      # Phase 3: -n 4 matches ci.yml::python-tests parallelism. The
      # pre-create step above already populated per-worker DBs from the
      # alembic-current xenon_test template.
      - run: uv run pytest -n 4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm run typecheck
      - run: cd web && npm run lint
      # Match ci.yml web-tests: exclude order-e2e.test.ts (pre-existing schema
      # drift tracked in #41). Regenerate universe fixtures like CI does.
      - name: Run vitest suite
        run: |
          cd web && npm run universe:gen
          cd .. && NODE_ENV=test ASSISTANT_MOCK=1 npx vitest run --config vitest.config.ts web/tests \
            --exclude 'web/tests/order-e2e.test.ts'
      - run: python3.13 scripts/release/version_sync_check.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract CHANGELOG section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          source scripts/release/_lib.sh
          {
            echo 'body<<EOF'
            extract_changelog_section CHANGELOG.md "$VERSION"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          make_latest: true

  ghcr-push:
    # Phase 1 Stage A — build the 4 deploy images and push to GHCR. Tag-only
    # trigger (inherited from `on:` above); never fires on PR or branch push.
    # Native arm64 runner: deploys target Apple Silicon Mac mini (arm64-only
    # platforms: line below). Building natively avoids QEMU emulation, which
    # was the dominant cost in the v0.0.7 release pipeline (~10 min on web).
    # Free for public repos.
    needs: verify
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/api.Dockerfile
          - image: web
            dockerfile: docker/web.Dockerfile
          - image: realtime
            dockerfile: docker/realtime.Dockerfile
          - image: migrator
            dockerfile: docker/migrator.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${REPO_OWNER}/xenon-${{ matrix.image }}"
          {
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
            echo "revision=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          # NEXT_PUBLIC_* vars must be present at `next build` time so they're baked
          # into the client bundle. Web image only — api/realtime/migrator ignore it.
          # Empty string for non-web images keeps the build-args block valid.
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ matrix.image == 'web' && secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || '' }}
          cache-from: type=gha,scope=xenon-${{ matrix.image }}
          cache-to: type=gha,scope=xenon-${{ matrix.image }},mode=max
