name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-typecheck:
    # Scope: app code only. `web/tests/**` and `web/e2e/**` have pre-existing
    # TS errors (type drift in test fixtures, loose Playwright types) tracked
    # in a follow-up PR. See web/tsconfig.json exclude list.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm install, not npm ci: the committed lockfile has a peer-optional gap
      # (transitive commander@^13 via Nuxt/bomb.sh tree) that npm 10 in this CI env
      # rejects but that resolves fine at install time. Follow-up: regenerate the
      # lockfile under Node 20 so npm ci can be restored.
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm run typecheck

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm run lint

  web-tests-unit:
    # Runs the full vitest suite EXCLUDING tests that shell out to live services
    # (FastAPI on :8321, `pi` CLI) or require populated `data/*.json` fixtures.
    # Those tests run in `web-tests-integration` as advisory — they reflect
    # dev-env expectations that don't port to a fresh CI runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm install --no-audit --no-fund --legacy-peer-deps
      - name: Run unit tests (exclude tests requiring live CLI, FastAPI, or data/ fixtures)
        # Excluded tests:
        #   integration.test.ts          — spawns `pi`, `kelly` CLIs
        #   menthorq-cta-route.test.ts   — spawns CLI + reads data/
        #   cta-route-freshness.test.ts  — reads data/
        #   cta-page-freshness.test.ts   — reads data/
        #   flex-token-expiry.test.ts    — reads data/flex-token-expiry.json
        #   order-e2e.test.ts            — requires FastAPI via ensureTestFastApi
        # All others run — local verification on 2026-04-24 showed 123/128 pass
        # with just mocks (the 5 failing are all order-e2e). See follow-up issue
        # for enabling data-fixture tests via seeded JSON.
        run: |
          cd web && npm run universe:gen
          cd .. && NODE_ENV=test ASSISTANT_MOCK=1 npx vitest run --config vitest.config.ts web/tests \
            --exclude 'web/tests/cta-route-freshness.test.ts' \
            --exclude 'web/tests/cta-page-freshness.test.ts' \
            --exclude 'web/tests/flex-token-expiry.test.ts' \
            --exclude 'web/tests/integration.test.ts' \
            --exclude 'web/tests/menthorq-cta-route.test.ts' \
            --exclude 'web/tests/order-e2e.test.ts'

  dead-code:
    # Advisory: runs the existing audit script at .claude/hooks/audit-dead-code.sh,
    # surfaces findings in the job log. Failure here doesn't block merges.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run dead-code audit
        run: |
          chmod +x .claude/hooks/audit-dead-code.sh
          .claude/hooks/audit-dead-code.sh

  web-tests-integration:
    # Advisory: tests that require live FastAPI / `pi` CLI / populated fixtures.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm test

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - run: pip install -r requirements.txt
      - name: Run pytest (affected on PR, full on master push)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3.13 scripts/infra/dev/run_pytest_affected.py --base origin/${{ github.base_ref }}
          else
            python3.13 -m pytest
          fi
