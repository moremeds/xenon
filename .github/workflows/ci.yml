name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-typecheck:
    # Scope: app code only. `web/tests/**` and `web/e2e/**` have pre-existing
    # TS errors (type drift in test fixtures, loose Playwright types) tracked
    # in a follow-up PR. See web/tsconfig.json exclude list.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # `npm run typecheck` triggers a `pretypecheck` hook that runs
      # `npm run universe:gen` via `uv run --project ..`. uv must be on PATH.
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm install, not npm ci: the committed lockfile has a peer-optional gap
      # (transitive commander@^13 via Nuxt/bomb.sh tree) that npm 10 in this CI env
      # rejects but that resolves fine at install time. Follow-up: regenerate the
      # lockfile under Node 20 so npm ci can be restored.
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm run typecheck

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm run lint

  web-tests:
    # Unified vitest job — runs the full suite, including tests that spawn
    # xenon-* CLIs from .venv/. Only `order-e2e` is excluded: it exercises the
    # FastAPI /orders/* contract and currently exposes a real schema drift
    # (reverted PR #34 aftermath). Tracked in #41 — fix the drift, then drop
    # the exclude.
    #
    # Fixtures: minimal data/*.json stubs are seeded by vitest globalSetup at
    # web/tests/setup/seed-fixtures.ts (portfolio.json, trade_log.json,
    # flex_token_config.json). Only written when absent, so dev machines with
    # real state aren't touched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.13
      - name: Sync Python deps (provides .venv/ + xenon-* CLIs for integration tests)
        run: uv sync --frozen --extra test
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm install --no-audit --no-fund --legacy-peer-deps
      - name: Run vitest suite
        run: |
          cd web && npm run universe:gen
          cd .. && NODE_ENV=test ASSISTANT_MOCK=1 npx vitest run --config vitest.config.ts web/tests \
            --exclude 'web/tests/order-e2e.test.ts'

  python-tests:
    runs-on: ubuntu-latest
    # Postgres is required: scripts/tests/conftest.py and src/xenon/api/tests/conftest.py
    # have autouse fixtures that truncate xenon.* tables before every test.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xenon_app
          POSTGRES_PASSWORD: xenon_dev
          POSTGRES_DB: xenon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xenon_app -d xenon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql+asyncpg://xenon_app:xenon_dev@localhost:5432/xenon_test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python 3.13 and sync deps
        run: |
          uv python install 3.13
          uv sync --frozen --extra test
      - name: Pre-create xenon/events schemas
        # Alembic creates xenon.alembic_version (its version-tracking table) before
        # running any migration's upgrade(), so the schema must exist before
        # `alembic upgrade head`. Locally the dev setup script handles this.
        env:
          PGPASSWORD: xenon_dev
        run: >-
          psql -h localhost -U xenon_app -d xenon_test
          -c "CREATE SCHEMA IF NOT EXISTS xenon; CREATE SCHEMA IF NOT EXISTS events;"
      - name: Apply alembic migrations to test DB
        env:
          DATABASE_URL: postgresql+asyncpg://xenon_app:xenon_dev@localhost:5432/xenon_test
        run: uv run alembic upgrade head
      - name: Pre-create per-worker DBs (Phase 3 pytest-xdist)
        # Serial loop in workflow yaml, not inside pytest, to avoid the race
        # that fails CREATE … TEMPLATE when multiple workers fight for the
        # same template under load. WITH TEMPLATE xenon_test clones the
        # schema-current alembic state into each per-worker DB.
        env:
          PGPASSWORD: xenon_dev
        run: |
          for i in 0 1 2 3; do
            psql -h localhost -U xenon_app -d postgres \
              -c "DROP DATABASE IF EXISTS xenon_test_gw$i WITH (FORCE);" \
              -c "CREATE DATABASE xenon_test_gw$i WITH TEMPLATE xenon_test;"
          done
      - name: Collection smoke test (import-level guard)
        # Catches missing deps / ImportError on files the affected-tests selector
        # would otherwise skip on a PR. ~1s, cheap insurance.
        run: >-
          uv run pytest --collect-only -q
          --ignore=scripts/tests/test_trend_scan.py
          --ignore=scripts/tests/test_trend_scan_runtime.py
          --ignore=scripts/tests/test_trend_config.py
          --ignore=scripts/tests/test_trend_models.py
          --ignore=scripts/tests/test_trend_storage.py
          --ignore=scripts/tests/test_trend_ranking.py
          --ignore=scripts/tests/test_trend_scan_catalysts.py
          --ignore=scripts/tests/test_ta_prefilter.py
          --ignore=scripts/tests/test_flow_confirmation.py
          --ignore=scripts/tests/test_volatility.py
          --ignore=scripts/tests/test_parquet_store.py
      - name: Run pytest (affected on PR, full on master push)
        # Phase 3: `-n 4` parallelizes across 4 workers. The Pre-create step
        # above already populated xenon_test_gw{0..3} from the schema-current
        # xenon_test template, so each worker connects to its own physical DB
        # and there is no cross-worker contention on shared tables.
        run: |
          IGNORES="--ignore=scripts/tests/test_trend_scan.py --ignore=scripts/tests/test_trend_scan_runtime.py --ignore=scripts/tests/test_trend_config.py --ignore=scripts/tests/test_trend_models.py --ignore=scripts/tests/test_trend_storage.py --ignore=scripts/tests/test_trend_ranking.py --ignore=scripts/tests/test_trend_scan_catalysts.py --ignore=scripts/tests/test_ta_prefilter.py --ignore=scripts/tests/test_flow_confirmation.py --ignore=scripts/tests/test_volatility.py --ignore=scripts/tests/test_parquet_store.py"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # `--` forwards $IGNORES to pytest via run_pytest_affected.py's
            # REMAINDER positional, instead of argparse rejecting them as
            # unknown flags.
            uv run python scripts/infra/dev/run_pytest_affected.py --base origin/${{ github.base_ref }} -- -n 4 $IGNORES
          else
            uv run pytest -n 4 $IGNORES
          fi

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3.13 scripts/release/version_sync_check.py

  order-path-guards:
    # Layer 2 of docs/plans/2026-04-28-order-path-regression-prevention.md.
    # Pure-stdlib Python — no uv sync, no Postgres. Runs in seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: No JSON fallback on order/migrated routes
        run: python3.13 scripts/checks/no_json_fallback_on_order_path.py
      - name: No JSON writes to data/ on order/API path
        run: python3.13 scripts/checks/no_json_write_on_order_path.py
      - name: ib_place_order caller allowlist
        run: python3.13 scripts/checks/order_path_caller_allowlist.py
      - name: RegimeGate present on every order entry point
        run: python3.13 scripts/checks/order_path_regime_gate_called.py
      - name: No ib_insync references (migrated to ib_async in PR #81)
        run: python3.13 scripts/checks/no_ib_insync.py
      - name: nav_history single-writer guard (Pass-2 T4)
        run: python3.13 scripts/checks/no_pg_insert_nav_history.py
