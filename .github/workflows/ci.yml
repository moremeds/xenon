name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-typecheck:
    # Scope: app code only. `web/tests/**` and `web/e2e/**` have pre-existing
    # TS errors (type drift in test fixtures, loose Playwright types) tracked
    # in a follow-up PR. See web/tsconfig.json exclude list.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm install, not npm ci: the committed lockfile has a peer-optional gap
      # (transitive commander@^13 via Nuxt/bomb.sh tree) that npm 10 in this CI env
      # rejects but that resolves fine at install time. Follow-up: regenerate the
      # lockfile under Node 20 so npm ci can be restored.
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm run typecheck

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm run lint

  web-tests:
    # Unified vitest job — runs the full suite, including tests that spawn
    # xenon-* CLIs from .venv/. Only `order-e2e` is excluded: it exercises the
    # FastAPI /orders/* contract and currently exposes a real schema drift
    # (reverted PR #34 aftermath). Tracked in #41 — fix the drift, then drop
    # the exclude.
    #
    # Fixtures: minimal data/*.json stubs are seeded by vitest globalSetup at
    # web/tests/setup/seed-fixtures.ts (portfolio.json, trade_log.json,
    # flex_token_config.json). Only written when absent, so dev machines with
    # real state aren't touched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.13
      - name: Sync Python deps (provides .venv/ + xenon-* CLIs for integration tests)
        run: uv sync --frozen --extra test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm install --no-audit --no-fund --legacy-peer-deps
      - name: Run vitest suite
        run: |
          cd web && npm run universe:gen
          cd .. && NODE_ENV=test ASSISTANT_MOCK=1 npx vitest run --config vitest.config.ts web/tests \
            --exclude 'web/tests/order-e2e.test.ts'

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python 3.13 and sync deps
        run: |
          uv python install 3.13
          uv sync --frozen --extra test
      - name: Collection smoke test (import-level guard)
        # Catches missing deps / ImportError on files the affected-tests selector
        # would otherwise skip on a PR. ~1s, cheap insurance.
        run: uv run pytest --collect-only -q
      - name: Run pytest (affected on PR, full on master push)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            uv run python scripts/infra/dev/run_pytest_affected.py --base origin/${{ github.base_ref }}
          else
            uv run pytest
          fi

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3.13 scripts/release/version_sync_check.py
