name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-typecheck:
    # Advisory until pre-existing tsc errors are fixed. Tracking issue: see PR description.
    # Pre-existing failures include TS7053 on e2e specs and TS2307 for root-level deps.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm install, not npm ci: the committed lockfile has a peer-optional gap
      # (transitive commander@^13 via Nuxt/bomb.sh tree) that npm 10 in this CI env
      # rejects but that resolves fine at install time. Follow-up: regenerate the
      # lockfile under Node 20 so npm ci can be restored.
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm run typecheck

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm run lint

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Root-level npm install too — vitest.config.ts is at the repo root and
      # pulls vitest from the root package.json.
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm install --no-audit --no-fund --legacy-peer-deps
      - run: cd web && npm test

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - run: pip install -r requirements.txt
      - name: Run pytest (affected on PR, full on master push)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3.13 scripts/infra/dev/run_pytest_affected.py --base origin/${{ github.base_ref }}
          else
            python3.13 -m pytest
          fi
