name: Apex Data Refresh

on:
  schedule:
    # Mon-Fri after US close: Tue-Sat 01:00 UTC = Mon-Fri ~8-9 PM ET (DST-dependent)
    # 01:00 UTC picked (rather than 00:00) to give Massive a ~5 hour buffer after 16:00 ET close.
    - cron: "0 1 * * 2-6"
    # Saturday full refresh: Sat 05:00 UTC = Fri night / early Sat ET
    - cron: "0 5 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh mode"
        required: true
        default: "incremental"
        type: choice
        options: [incremental, full]
      timeframes:
        description: "Comma-separated timeframes"
        required: false
        default: "1d,1h"

permissions:
  contents: read

concurrency:
  group: apex-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install TA-Lib C library
        run: |
          sudo apt-get update
          sudo apt-get install -y ta-lib

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pyarrow pandas requests python-dotenv ta-lib

      - name: Determine mode from trigger
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "timeframes=${{ github.event.inputs.timeframes }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 5 * * 6" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "timeframes=1d,1h" >> "$GITHUB_OUTPUT"
          else
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
            echo "timeframes=1d,1h" >> "$GITHUB_OUTPUT"
          fi

      - name: Run apex_refresh
        run: |
          python scripts/apex_refresh.py \
            --mode "${{ steps.mode.outputs.mode }}" \
            --timeframes "${{ steps.mode.outputs.timeframes }}" \
            --max-workers 5
