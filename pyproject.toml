[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xenon"
version = "0.2.0"
requires-python = ">=3.13"
description = "Broker terminal for options portfolio management (IB primary, Futu read-only)"
readme = "README.md"
dependencies = [
    # Cloud / data
    "boto3>=1.42",
    "botocore>=1.42",
    "pyarrow>=15.0",
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    # Auth
    "PyJWT>=2.9",
    "cryptography>=43.0",
    # HTTP + config
    "requests>=2.28",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
    # Numerics
    "pandas>=1.5",
    "numpy>=1.26",
    # Brokers
    "ib_async>=1.0.0",
    "futu-api>=9.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.15.0",
    "exchange-calendars>=4.5,<5.0",
]

[project.scripts]
xenon-api                = "xenon.api.server:main"
xenon-blotter            = "xenon.trade_blotter.cli:main"
xenon-blotter-history    = "xenon.trade_blotter.flex_query:main"
xenon-market-hours       = "xenon.utils.market_hours:main"
xenon-presets            = "xenon.utils.presets:main"
xenon-monitor-daemon     = "xenon.monitor_daemon.run:main"
xenon-preset-rebalance   = "xenon.monitor_daemon.handlers.preset_rebalance:main"
xenon-ib-execute         = "xenon.execution.ib_execute:main"
xenon-ib-place-order     = "xenon.execution.ib_place_order:main"
xenon-ib-order-manage    = "xenon.execution.ib_order_manage:main"
xenon-ib-orders          = "xenon.execution.ib_orders:main"
xenon-ib-option-chain    = "xenon.execution.ib_option_chain:main"
xenon-ib-reconcile       = "xenon.execution.ib_reconcile:main"
xenon-ib-sync            = "xenon.execution.ib_sync:main"
xenon-naked-short-audit  = "xenon.execution.naked_short_audit:main"
xenon-futu-sync          = "xenon.execution.futu_sync:main"
xenon-futu-history-sync  = "xenon.cli.futu_history_sync:main"
xenon-portfolio-report   = "xenon.reports.portfolio_report:main"
xenon-portfolio-attrib   = "xenon.reports.portfolio_attribution:main"
xenon-portfolio-perf     = "xenon.reports.portfolio_performance:main"
xenon-perf-explainer     = "xenon.reports.performance_explainer_report:main"
xenon-nav-flex-refresh   = "xenon.jobs.nav_flex_refresh:main"

[project.optional-dependencies]
test = [
    "moto[s3]>=5.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.8",
    "responses>=0.25",
    "freezegun>=1.5",
]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
]
extras = []

[tool.hatch.build.targets.wheel]
packages = ["src/xenon"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]  # line length handled separately

[tool.ruff.lint.isort]
known-first-party = [
    "execution",
    "reports",
    "services",
    "infra",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
norecursedirs = [
    "scripts/infra/ib_realtime",
    ".venv",
    "node_modules",
    ".claude",
    ".worktrees",
    "data",
    "logs",
    "tmp",
]
markers = [
    "e2e: end-to-end tests requiring live external services",
    "committed_db: test needs row-level commits visible across separate SQLAlchemy engines (subprocess CLIs, ad-hoc create_engine helpers). Uses Phase 1 TRUNCATE pre+post instead of Phase 2 txn rollback.",
]

