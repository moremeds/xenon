[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]  # line length handled separately

[tool.ruff.lint.isort]
known-first-party = ["utils", "trade_blotter"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "integration: live tests hitting real MenthorQ (requires credentials)",
    "e2e: end-to-end tests requiring live external services",
]

[project]
dependencies = [
    "boto3>=1.42",
    "pyarrow>=15.0",
    "botocore>=1.42",
]

[project.optional-dependencies]
test = [
    "moto[s3]>=5.0",
]
