[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xenon"
version = "0.2.0"
requires-python = ">=3.13"
description = "Broker terminal for options portfolio management (IB primary, Futu read-only)"
readme = "README.md"
dependencies = [
    # Cloud / data
    "boto3>=1.42",
    "botocore>=1.42",
    "pyarrow>=15.0",
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    # HTTP + config
    "requests>=2.28",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
    # Numerics
    "pandas>=1.5",
    "numpy>=1.26",
    # Brokers
    "ib_async>=1.0.0",
    "futu-api>=9.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.15.0",
    # Futu daily statement ingestion (IMAP fetch + AES-encrypted PDF parse)
    "pikepdf>=9.0",
    "pdfplumber>=0.11",
    # Microsoft OAuth (IMAP XOAUTH2 — consumer Outlook is OAuth-only)
    "msal>=1.30",
    "exchange-calendars>=4.5,<5.0",
    "scipy>=1.17.1",
]

[project.scripts]
xenon-blotter            = "xenon.trade_blotter.cli:main"
xenon-blotter-history    = "xenon.trade_blotter.flex_query:main"
xenon-market-hours       = "xenon.utils.market_calendar:main"
xenon-api                = "xenon.api.server:main"
xenon-ib-orders          = "xenon.execution.ib_orders:main"
xenon-ib-option-chain    = "xenon.execution.ib_option_chain:main"
xenon-ib-market-depth    = "xenon.execution.ib_market_depth:main"
xenon-ib-option-greeks   = "xenon.execution.ib_option_greeks:main"
xenon-ib-reconcile       = "xenon.execution.ib_reconcile:main"
xenon-ib-sync            = "xenon.execution.ib_sync:main"
xenon-naked-short-audit  = "xenon.execution.naked_short_audit:main"
xenon-futu-sync          = "xenon.execution.futu_sync:main"
xenon-futu-history-sync  = "xenon.cli.futu_history_sync:main"
xenon-futu-statement-sync = "xenon.cli.futu_statement_sync:main"
xenon-futu-quotes        = "xenon.futu_quotes.__main__:main"
xenon-portfolio-report   = "xenon.reports.portfolio_report:main"
xenon-portfolio-attrib   = "xenon.reports.portfolio_attribution:main"
xenon-nav-flex-refresh   = "xenon.jobs.nav_flex_refresh:main"
xenon-nav-reconcile      = "xenon.jobs.nav_reconcile:main"

[project.optional-dependencies]
test = [
    "moto[s3]>=5.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.8",
    "responses>=0.25",
    "freezegun>=1.5",
]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
]
extras = []

[tool.hatch.build.targets.wheel]
packages = ["src/xenon"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]  # line length handled separately

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are append-only history; the template imports `sa` even when unused.
"src/xenon/db/migrations/versions/*.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = [
    "execution",
    "reports",
    "services",
    "infra",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = '-m "not live_ib"'
norecursedirs = [
    "scripts/infra/ib_realtime",
    ".venv",
    "node_modules",
    ".claude",
    ".worktrees",
    "data",
    "logs",
    "tmp",
]
markers = [
    "e2e: end-to-end tests requiring live external services",
    "committed_db: test needs row-level commits visible across separate SQLAlchemy engines (subprocess CLIs, ad-hoc create_engine helpers). Uses Phase 1 TRUNCATE pre+post instead of Phase 2 txn rollback.",
    "live_ib: test connects to the live IB Gateway (port 4001). Deselected by default addopts; run explicitly with `pytest -m live_ib`. Operator opt-in — the only exemption from the broker guard (all layers no-op).",
    "paper_ib: test connects to the paper IB Gateway (127.0.0.1:4002). Sets XENON_TEST_BROKER_ALLOW=127.0.0.1:4002 — the one endpoint every guard layer lets through; all other broker endpoints still refused. Only run when explicit paper config is in place.",
]

