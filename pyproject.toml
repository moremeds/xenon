[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xenon"
version = "0.2.0"
requires-python = ">=3.13"
description = "Market structure reconstruction system"
readme = "README.md"
dependencies = [
    "boto3>=1.42",
    "pyarrow>=15.0",
    "botocore>=1.42",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv",
    "duckdb>=1.2.0",
]

[project.optional-dependencies]
test = [
    "moto[s3]>=5.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "responses>=0.25",
    "freezegun>=1.5",
]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xenon"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]  # line length handled separately

[tool.ruff.lint.isort]
known-first-party = [
    "utils",
    "trade_blotter",
    "fetchers",
    "scanners",
    "execution",
    "reports",
    "shares",
    "services",
    "ta",
    "infra",
    "clients",
    "analysis",
    "scanner_lib",
    "trend_scan_lib",
    "uw_scan_lib",
    "ta_lib",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
norecursedirs = [
    "scripts/infra/ib_realtime",
    ".venv",
    "node_modules",
    "data",
    "logs",
    "tmp",
]
markers = [
    "integration: live tests hitting real MenthorQ (requires credentials)",
    "e2e: end-to-end tests requiring live external services",
]
